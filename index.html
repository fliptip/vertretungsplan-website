<!DOCTYPE html>
<html>
  <head>
    <title>Vertretungsplan</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="src/styles.css" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
      name="theme-color"
      content="orange"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1d2f37"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: dark)" content="orange">
    <meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: light)" content="#1d2f37">
    <meta name="apple-mobile-web-app-title" content="Vertretungsplan">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/src/icon.png" />
    <link rel="apple-touch-icon" href="/src/icon.png" />
    <link
    rel="apple-touch-startup-image"
    media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    href="/assets/375x812.png"
  />
    <meta property="og:title" content="Caro Vertretungsplan" />
    <meta
      property="og:description"
      content="Vertretung von jedem beliebigen Tag nachschauen."
    />
    <meta
      name="description"
      content="Vertretung von jedem beliebigen Tag nachschauen."
    />
    <meta
      property="og:site_name"
      content="Caro Vertretungsplan für jeden Tag."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://vertretungsplan.fliptip.workers.dev https://api.websitecarbon.com; script-src 'self' https://unpkg.com/website-carbon-badges@1.1.3/b.min.js;"
    />
  </head>

  <body style="margin: 0; padding: 0">
    <header>
      <span class="headertext" style="top: 0rem">Gemacht von Heinrich</span>
      <hr />
      <span class="headertext" style="top: 1.2rem">
        gehostet mit nachhaltigen Energien
      </span>
      <hr />
      <input class="headertext" type="date" id="datePicker" name="datePicker" />
      <p id="scrolldown">scroll down</p>
    </header>
    <script src="src/index.js"></script>
    <!-- <hr> -->
    <div id="app">
      <div id="content">
        <div id="table">
          <table class="plan" id="plan0">
            <tr>
              <th>Klasse</th>
              <th>Stunde</th>
              <th>Fach</th>
              <th>Raum</th>
              <th>Lehrer</th>
              <th id="infotext">Text</th>
            </tr>
          </table>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/website-carbon-badges@1.1.3/b.min.js"
      defer=""
    ></script>

    <footer>
      <div id="wcb" class="carbonbadge"></div>
    </footer>
  </body>
</html>
