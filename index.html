<!DOCTYPE html>
<html>
  <head>
    <title>Vertretungsplan</title>
    <script src="index.js" defer></script>
    <link rel="manifest" href="/src/manifest.json">
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover,width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="styles.css" />
    <meta
      name="theme-color"
      content="orange"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000d17"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-title" content="Vertretungsplan">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/src/icon.png" />
    <link rel="apple-touch-icon" href="/src/icon.png" />
    <meta property="og:title" content="Caro Vertretungsplan" />
    <meta
      property="og:description"
      content="Vertretung von jedem beliebigen Tag nachschauen."
    />
    <meta
      name="description"
      content="Vertretung von jedem beliebigen Tag nachschauen."
    />
    <meta
      property="og:site_name"
      content="Caro Vertretungsplan für jeden Tag."
    />
  </head>

  <body>
  <div id="app">
    <div id="header">
      <div id="topbar">
        <div id="title" style="top: 0;height: 3.5em;">
          <h1>Vertretungsplan</h1>
          <span style="text-align: left;position: relative;top: -.4em;">gemacht von Heinrich</span>
        </div>
        <input type="date" id="datePicker" name="datePicker">
      </div>
    </div>
    <div id="content">
      <div>
        <div id="table">
          <table class="plan" id="plan0">
            <tr>
              <th>Klasse</th>
              <th>Stunde</th>
              <th>Fach</th>
              <th>Raum</th>
              <th>Lehrer</th>
              <th id="infotext">Text</th>
            </tr>
          </table>
        </div>
        <div id="undertable">
          <span id="lastUpdate">Vertretungsplan nicht geladen</span>
          <button id="refreshData">neu laden</button>
        </div>
      </div>
    </div>
    <script
      src="/src/app.js"
    ></script>
    <script
      src="https://unpkg.com/website-carbon-badges@1.1.3/b.min.js"
      defer=""
    ></script>

    <footer>
      <div id="footerco2">
        <a href="https://www.websitecarbon.com/website/caro-os-pages-dev/">
          <div id="wcb" class="carbonbadge"></div>
        </a>
      </div>
      <hr>
      <div id="footercontent">
        <details>
          <summary>Zugangscode</summary>
          <button id="changeAccessKey">
            ändern
          </button>
          <button id="deleteAccessKey">
            zurücksetzen
          </button>
        </details>
      </div>
    </footer>
  </div>
  <script src="src/acceskeybuttons.js"></script>
  </body>
</html>
